<meta charset="utf-8">

<title>Τρίλιζα Ευρωλίγκας</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@600;800&family=Commissioner:wght@400;500;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0;padding-top:max(14px,env(safe-area-inset-top))!important}
/* Layout: one narrow column like a scoreboard on a phone — status strip, the 4×4 board (criteria headers + 3×3 cells), actions, play-by-play. */
:root{
  --floor:#eef1f6;      /* page */
  --panel:#ffffff;      /* board surfaces */
  --ink:#121b2e;        /* text */
  --muted:#5d6880;      /* secondary text */
  --line:#d3d9e4;       /* hairlines */
  --x:#e0560f;          /* team X: ball orange */
  --o:#1769a8;          /* team O: key-paint blue */
  --x-soft:#fde7da;
  --o-soft:#dcebf7;
  --ok:#1f8a4c;
  --bad:#c23131;
  --head:#e4e9f2;
  --font-display:"Fira Sans Extra Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Commissioner",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --floor:#0d1220;--panel:#161d30;--ink:#e9edf5;--muted:#9aa5bd;--line:#2a3450;
  --x:#ff7a35;--o:#4ea3e6;--x-soft:#3a2216;--o-soft:#15304a;--ok:#4cc27e;--bad:#ff6b6b;--head:#1d2640;color-scheme:dark}}
:root[data-theme="dark"]{
  --floor:#0d1220;--panel:#161d30;--ink:#e9edf5;--muted:#9aa5bd;--line:#2a3450;
  --x:#ff7a35;--o:#4ea3e6;--x-soft:#3a2216;--o-soft:#15304a;--ok:#4cc27e;--bad:#ff6b6b;--head:#1d2640;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--floor);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:14px 40px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--font-display);font-weight:800;font-size:2rem;line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
h1 .x{color:var(--x)} h1 .o{color:var(--o)}
h2{font-family:var(--font-display);font-weight:600;font-size:1.25rem;margin:0}
p{margin:0}
.sub{color:var(--muted);font-size:.9rem}
button,input{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;text-align:left}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,input:focus-visible,.cell:focus-visible{outline:3px solid var(--o);outline-offset:2px}
.btn.primary{background:var(--ink);color:var(--floor);border-color:var(--ink)}
.btn small{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
.btn.primary small{color:inherit;opacity:.75}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row > *{flex:1 1 auto}
input[type=text]{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px}
.stack{display:flex;flex-direction:column;gap:10px}
.note{border-left:3px solid var(--line);padding-left:12px;color:var(--muted);font-size:.88rem}
.err{color:var(--bad);font-size:.9rem}

/* scoreboard strip */
.strip{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.side{display:flex;flex-direction:column;gap:2px;min-width:0}
.side.r{text-align:right;align-items:flex-end}
.mark{font-family:var(--font-display);font-weight:800;font-size:1.9rem;line-height:1}
.mark.X{color:var(--x)} .mark.O{color:var(--o)}
.who{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.side.active .who{color:var(--ink);font-weight:700}
.score{font-family:var(--font-display);font-weight:600;font-size:1rem;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.turnbar{font-family:var(--font-display);font-weight:600;font-size:1.15rem;text-align:center}
.turnbar .X{color:var(--x)} .turnbar .O{color:var(--o)}

/* board */
.board{display:grid;grid-template-columns:minmax(90px,1.1fr) repeat(3,1fr);gap:6px}
.hd{background:var(--head);border-radius:8px;padding:6px 6px;display:flex;flex-direction:column;justify-content:center;gap:3px;min-height:64px;min-width:0}
.hd .t{font-family:var(--font-display);font-weight:600;font-size:.95rem;line-height:1.1;overflow-wrap:normal;word-break:normal;max-width:100%;width:100%;overflow:hidden}
.hd .t.long{font-size:.8rem}
.hd .t.xl{font-size:.72rem}
.hd .t.xxl{font-size:.64rem}
.hd .k{font-size:.62rem;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-transform:uppercase;color:var(--muted)}
.hd.col{text-align:center;align-items:center}
.corner{display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;color:var(--muted);font-size:.8rem;text-align:center;line-height:1.1}
.cell{aspect-ratio:1/1;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;cursor:pointer;position:relative;min-width:0}
.cell:hover:not([disabled]){border-color:var(--muted)}
.cell[disabled]{cursor:default}
.cell .m{font-family:var(--font-display);font-weight:800;font-size:2.4rem;line-height:.9}
.cell .pn{font-size:.68rem;line-height:1.15;text-align:center;overflow-wrap:anywhere}
.cell.X{background:var(--x-soft);border-color:var(--x)} .cell.X .m{color:var(--x)}
.cell.O{background:var(--o-soft);border-color:var(--o)} .cell.O .m{color:var(--o)}
.cell.win{box-shadow:0 0 0 3px var(--ink) inset}
.cell .plus{color:var(--line);font-size:1.6rem;font-weight:300}
.cell.reveal .ans{font-size:.62rem;color:var(--muted);text-align:center;line-height:1.2}

/* play-by-play */
.log{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.log .e{display:flex;gap:8px;align-items:baseline}
.log .tag{font-family:var(--font-display);font-weight:800;width:1.1em;flex:none}
.log .tag.X{color:var(--x)} .log .tag.O{color:var(--o)}
.log .ok{color:var(--ok);font-weight:700} .log .bad{color:var(--bad);font-weight:700}

/* code display */
.codebox{background:var(--panel);border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.code{font-family:var(--font-display);font-weight:800;font-size:3rem;letter-spacing:.2em;line-height:1;font-variant-numeric:tabular-nums}

/* answer sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(5,10,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--floor);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;max-height:85vh;overflow:auto}
.sheet .q{font-family:var(--font-display);font-weight:600;font-size:1.1rem;line-height:1.2}
.sheet .q b{color:var(--x)} .sheet .q i{font-style:normal;color:var(--o)}
.res{display:flex;flex-direction:column;gap:4px}
.res button{display:flex;justify-content:space-between;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left}
.res button:hover{border-color:var(--muted)}
.res button[disabled]{opacity:.45;cursor:default}
.res .nat{color:var(--muted);font-size:.8rem;flex:none}
.toast{font-weight:700;text-align:center;padding:8px;border-radius:8px}
.toast.ok{color:var(--ok)} .toast.bad{color:var(--bad)}
.rules{font-size:.88rem;color:var(--muted);display:flex;flex-direction:column;gap:6px;padding-left:18px;margin:0}
@media (prefers-reduced-motion:no-preference){.cell.X,.cell.O{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.85)}to{transform:scale(1)}}}
</style>

<script>
"use strict";
const DATA = JSON.parse(document.getElementById('data').textContent);
const P = DATA.players, C = DATA.crit;
const CI = Object.fromEntries(C.map((c,i)=>[c.id,i]));
const CS = C.map(c=>new Set(c.ids));
const TYPE_LABEL = {club:'Ομάδα',title:'Τίτλος',nat:'Εθνικότητα',other:'Προφίλ',teammate:'Συμπαίκτης',coach:'Κόουτς'};
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

/* ---------- search: Greek or Latin input ---------- */
const GR2 = [['ου','ou'],['μπ','mp'],['ντ','nt'],['γκ','gk'],['γγ','ng'],['τσ','ts'],['τζ','j'],['αι','e'],['ει','i'],['οι','i'],['αυ','av'],['ευ','ev']];
const GR1 = {α:'a',β:'v',γ:'g',δ:'d',ε:'e',ζ:'z',η:'i',θ:'th',ι:'i',κ:'k',λ:'l',μ:'m',ν:'n',ξ:'ks',ο:'o',π:'p',ρ:'r',σ:'s',ς:'s',τ:'t',υ:'i',φ:'f',χ:'ch',ψ:'ps',ω:'o'};
function norm(s){
  s = s.toLowerCase().replace(/([άόέ])ι/g, (m,v) => ({ά:'a',ό:'o',έ:'e'})[v]+'i').replace(/([αοε])[ϊΐ]/g, (m,v) => ({α:'a',ο:'o',ε:'e'})[v]+'i')
       .normalize('NFD').replace(/[̀-ͯ]/g,'');
  for (const [a,b] of GR2) s = s.split(a).join(b);
  s = s.replace(/[α-ως]/g, ch => GR1[ch] ?? ch);
  return s.replace(/ı/g,'i').replace(/đ/g,'dj').replace(/ł/g,'l').replace(/ß/g,'ss').replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim();
}
function skel(s, keepVowels, hardC){
  s = s.replace(/sch/g,'s').replace(/sh/g,'s').replace(/ch/g,'h').replace(/ck/g,'k').replace(hardC ? /c(?=[eiy])/g : /c(?=[eiy]|$| )/g,'ts').replace(/c/g,'k').replace(/j/g,'i').replace(/g(?=i[aeou])/g,'')
       .replace(/mp|mb/g,'b').replace(/nt|nd/g,'d').replace(/ngk|ngg|gk|nk|ng/g,'g').replace(/th/g,'t').replace(/ph/g,'f').replace(/f/g,'v').replace(/x/g,'ks').replace(/q/g,'k').replace(/w/g,'v').replace(/y/g,'i').replace(/z/g,'ts')
       .replace(/ou/g,'u').replace(/gu(?=[aeio])/g,'v');
  if (!keepVowels) s = s.replace(/[aeiou ]/g,'');
  return s.replace(/(.)\1+/g,'$1');
}
const ALIAS = {'Sergio Llull':'Γιουλ','Sergio Rodríguez':'Τσάτσο Chacho','Edy Tavares':'Walter','Theo Papaloukas':'Θοδωρής Theodoros','Nick Calathes':'Νίκος','Dimitris Diamantidis':'Δημήτρης','Vassilis Spanoulis':'Βασίλης Kill Bill','Juan Carlos Navarro':'Λα Μπόμπα','Bobby Dixon':'Ali Muhammed','Edgaras Ulanovas':'','Luka Dončić':'Λούκα'};
function phon(s){ return skel(s, true); }
function tailsOf(ws){ return ws.map((_,j) => ws.slice(j).join('')); }
function lev(a,b){ const m=a.length,n=b.length; if(!m)return n; if(!n)return m; let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; } return prev[n]; }
const IDX = P.map(p => { const n = norm(p.n), nw = n.split(' ').filter(Boolean), aw = norm(ALIAS[p.n]||'').split(' ').filter(Boolean), words = nw.concat(aw);
  const tails = tailsOf(nw).concat(tailsOf(aw));
  return {n, words, k:skel(words.join(' ')), tk:tails.flatMap(w=>[skel(w), skel(w,false,true)]), tp:tails.flatMap(w=>[phon(w), skel(w,true,true)])}; });
function search(q){
  const qn = norm(q); if (qn.length < 2) return [];
  const qk = skel(qn), qp = phon(qn.replace(/ /g,''));
  const out = [], N = P.length;
  IDX.forEach((x,i) => {
    let s = 0;
    if (x.n.startsWith(qn) || x.words.some(w => w.startsWith(qn))) s = 3;
    else if (x.n.includes(qn)) s = 2;
    else if (qk.length >= 2 && x.tk.some(w => w.startsWith(qk))) s = 1;
    else if (qk.length >= 2 && x.k.includes(qk)) s = 0.5;
    if (!s) return;
    if (s < 2){ const d = Math.min(...x.tp.map(w => lev(qp, w.slice(0, qp.length + 1)))); s += 0.9/(1+d); }
    out.push([s + 0.2*(1 - i/N), i]);
  });
  out.sort((a,b) => b[0]-a[0] || a[1]-b[1]);
  return out.slice(0,10).map(x=>x[1]);
}

/* ---------- grid generation ---------- */
const WEIGHTS = {club:.45,title:.12,nat:.13,other:.08,teammate:.12,coach:.10};
const BYTYPE = {}; C.forEach((c,i)=>(BYTYPE[c.type] ||= []).push(i));
function pickCrit(){
  let r = Math.random(), t;
  for (t in WEIGHTS){ r -= WEIGHTS[t]; if (r <= 0) break; }
  const list = BYTYPE[t] || BYTYPE.club;
  let w = list.reduce((a,i)=>a+(C[i].w||1),0) * Math.random();
  for (const i of list){ w -= C[i].w||1; if (w <= 0) return i; }
  return list[list.length-1];
}
function compatible(a,b){
  const A=C[a],B=C[b];
  if (A.type===B.type && ['nat','other','title','coach'].includes(A.type)) return false;
  return true;
}
const answers = (r,c) => C[r].ids.filter(i => CS[c].has(i));
function makeGrid(){
  for (let k=0;k<20000;k++){
    const six = new Set(); while (six.size<6) six.add(pickCrit());
    const a = [...six].sort(()=>Math.random()-.5), rows=a.slice(0,3), cols=a.slice(3);
    if (!rows.some(x=>C[x].type==='club') || !cols.some(x=>C[x].type==='club')) continue;
    if (rows.every(r=>cols.every(c=>compatible(r,c) && answers(r,c).length>=3)))
      return {rows:rows.map(i=>C[i].id), cols:cols.map(i=>C[i].id)};
  }
  return {rows:['club_PAO','club_OLY','club_RMA'], cols:['won_el','nba','pos_G']};
}

/* ---------- game state ---------- */
function newGame(round, seats){
  return {v:1, status: seats && !seats.O ? 'waiting' : 'playing', grid:makeGrid(), cells:Array(9).fill(null),
          turn: round%2===1 ? 'X' : 'O', seats: seats||{X:null,O:null}, used:[], log:[], passes:0,
          winner:null, line:null, round, wins:{X:0,O:0}, updated:Date.now()};
}
function cellCrit(st, cell){ return [CI[st.grid.rows[Math.floor(cell/3)]], CI[st.grid.cols[cell%3]]]; }
function applyMove(st, cell, pIdx){ // pIdx null = pass
  const s = structuredClone(st), me = s.turn;
  let ok = false;
  if (pIdx == null){ s.passes++; s.log.unshift({w:me, a:'pass'}); }
  else {
    const [r,c] = cellCrit(s, cell);
    ok = CS[r].has(pIdx) && CS[c].has(pIdx) && !s.used.includes(pIdx) && !s.cells[cell];
    s.passes = 0;
    s.log.unshift({w:me, a: ok?'ok':'bad', c:cell, p:pIdx});
    if (ok){ s.cells[cell] = {m:me, p:pIdx}; s.used.push(pIdx); }
  }
  s.log = s.log.slice(0,40);
  const line = LINES.find(L => L.every(i => s.cells[i] && s.cells[i].m===me));
  if (line){ s.status='over'; s.winner=me; s.line=line; s.wins[me]++; }
  else if (s.cells.every(Boolean) || s.passes>=2){
    s.status='over';
    const nx = s.cells.filter(x=>x&&x.m==='X').length, no = s.cells.filter(x=>x&&x.m==='O').length;
    s.winner = nx>no ? 'X' : no>nx ? 'O' : 'draw';
    if (s.winner!=='draw') s.wins[s.winner]++;
  } else s.turn = me==='X' ? 'O' : 'X';
  s.updated = Date.now();
  return {s, ok};
}

/* ---------- app state (standalone, relay through public MQTT brokers) ----------
   The game state is published as a *retained* message on two public brokers, so it
   survives a player closing the tab, locking the phone or switching apps: whoever
   opens the link later gets the latest state immediately. */
const BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt', 'wss://test.mosquitto.org:8081/mqtt'];
const TOPIC = code => 'eltrilliza/v2/' + code;

const ALPH = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
const CODE_LEN = 5;
const GREEK_LOOK = {'Α':'A','Β':'B','Ε':'E','Ζ':'Z','Η':'H','Ι':'I','Κ':'K','Μ':'M','Ν':'N','Ο':'O','Ρ':'P','Τ':'T','Υ':'Y','Χ':'X'};
const cleanCode = s => s.toUpperCase().split('').map(ch => GREEK_LOOK[ch] || ch).join('').replace(/[^A-Z]/g,'').slice(0,CODE_LEN);
const randCode = () => Array.from({length:CODE_LEN},()=>ALPH[Math.floor(Math.random()*ALPH.length)]).join('');
const inviteLink = code => location.origin + location.pathname + '?g=' + code;
const other = r => r==='X' ? 'O' : 'X';

function save(){ try { if (app.mode==='online') localStorage.setItem('eltri-session', JSON.stringify({role:app.role, code:app.code})); } catch(e){} }
function loadSaved(){ try { return JSON.parse(localStorage.getItem('eltri-session') || 'null'); } catch(e){ return null; } }
function forget(){ try { localStorage.removeItem('eltri-session'); } catch(e){} }

function libReady(){
  if (typeof mqtt === 'object' && typeof mqtt.connect === 'function') return true;
  app.msg = 'Δεν φόρτωσε η βιβλιοθήκη σύνδεσης. Έλεγξε το ίντερνετ και ανανέωσε τη σελίδα.'; render(); return false;
}
function onState(st){
  if (!st || typeof st.seq !== 'number' || !st.grid) return;
  if (app.st && !(st.round > app.st.round || (st.round === app.st.round && st.seq > app.st.seq))) return;
  app.st = st;
  if (app.joinTimer){ clearTimeout(app.joinTimer); app.joinTimer = null; }
  // a guest arriving at a game that is still waiting takes seat O and starts it
  if (app.role === 'guest' && st.status === 'waiting'){
    const n = structuredClone(st); n.status = 'playing'; n.seats.O = 'joined'; publish(n); return;
  }
  app.msg = ''; render();
}
function onHeartbeat(m){
  if (!m || m.r !== other(app.me)) return;
  if (Math.abs(Date.now() - m.t) < 90000){ app.oppSeen = Date.now(); render(); }
}
function connectAll(code){
  disconnectAll();
  const topic = TOPIC(code);
  app.clients = BROKERS.map((url, i) => {
    const c = mqtt.connect(url, {clientId:'eltri_' + Math.random().toString(36).slice(2,12), clean:true, keepalive:30, reconnectPeriod:2500, connectTimeout:10000});
    c.on('connect', () => {
      if (app.unsent.has(i) && app.st){ c.publish(topic + '/state', JSON.stringify(app.st), {qos:1, retain:true}); app.unsent.delete(i); }
      c.subscribe([topic + '/state', topic + '/hb/+'], {qos:1}); countConnected(); heartbeat();
    });
    c.on('close', countConnected);
    c.on('offline', countConnected);
    c.on('error', () => {});
    c.on('message', (t, payload) => {
      let m; try { m = JSON.parse(payload.toString()); } catch(e){ return; }
      if (t.endsWith('/state')) onState(m); else onHeartbeat(m);
    });
    return c;
  });
  app.hbTimer = setInterval(heartbeat, 15000);
}
function countConnected(){
  const n = app.clients.filter(c => c.connected).length;
  if (n !== app.connected){ app.connected = n; if (n && !app.unsent.size && app.msg.startsWith('Δεν υπάρχει σύνδεση')) app.msg=''; render(); }
}
function heartbeat(){
  if (!app.code || !app.me) return;
  const msg = JSON.stringify({r:app.me, t:Date.now()});
  app.clients.forEach(c => { if (c.connected) c.publish(TOPIC(app.code) + '/hb/' + app.me, msg, {qos:0, retain:true}); });
}
function disconnectAll(){
  if (app.hbTimer) clearInterval(app.hbTimer); app.hbTimer = null;
  app.clients.forEach(c => { try { c.end(true); } catch(e){} });
  app.clients = []; app.connected = 0; app.unsent = new Set();
}
function publish(st){
  st.seq = (app.st && app.st.round === st.round ? app.st.seq : (st.seq||0)) + 1;
  st.updated = Date.now();
  app.st = st; render();
  const body = JSON.stringify(st), topic = TOPIC(app.code) + '/state';
  let sent = 0;
  app.clients.forEach((c, i) => { if (c.connected){ c.publish(topic, body, {qos:1, retain:true}); app.unsent.delete(i); sent++; } else app.unsent.add(i); });
  if (!sent && app.st.seq > 1){ app.msg = 'Δεν υπάρχει σύνδεση. Η κίνηση θα σταλεί μόλις επανέλθει το ίντερνετ.'; render(); }
}
function createOnline(){
  if (!libReady()) return;
  const code = randCode();
  app.mode='online'; app.role='host'; app.me='X'; app.code=code; app.msg='';
  const st = newGame(1, {X:'host', O:null}); st.seq = 0;
  save(); connectAll(code);
  app.st = st; publish(st);
}
function joinOnline(raw){
  const code = cleanCode(raw);
  if (code.length!==CODE_LEN){ app.msg='Ο κωδικός έχει ' + CODE_LEN + ' γράμματα.'; render(); return; }
  if (!libReady()) return;
  const saved = loadSaved();
  const role = saved && saved.code===code ? saved.role : 'guest';
  app.mode='online'; app.role=role; app.me = role==='host' ? 'X' : 'O'; app.code=code; app.st=null; app.msg='';
  save(); connectAll(code); render();
  app.joinTimer = setTimeout(() => { if (!app.st){ app.msg = app.connected ? 'Δεν βρέθηκε παιχνίδι με κωδικό ' + code + '. Έλεγξε τον κωδικό.' : 'Δεν μπορώ να συνδεθώ. Έλεγξε το ίντερνετ.'; render(); } }, 8000);
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState!=='visible' || app.mode!=='online') return;
  app.clients.forEach(c => { if (!c.connected && !c.reconnecting) { try { c.reconnect(); } catch(e){} } });
  heartbeat();
});
function commit(next){
  if (app.mode==='online'){ publish(next); return; }
  next.seq = (app.st && app.st.seq || 0) + 1; app.st = next; render();
}
function startLocal(){ app.mode='local'; app.role=null; app.code=null; app.st = newGame(1); app.st.seq=0; app.me=null; app.msg=''; render(); }
function leave(){
  disconnectAll();
  if (app.joinTimer) clearTimeout(app.joinTimer);
  if (app.mode==='online' && app.st && app.st.status==='over') forget();
  Object.assign(app,{mode:null,role:null,st:null,code:null,me:null,oppSeen:0,msg:'',reveal:false});
  try { history.replaceState(null,'',location.pathname); } catch(e){}
  render();
}
function canAct(){
  const st = app.st; if (!st || st.status!=='playing') return false;
  if (app.mode==='local') return true;
  return app.connected > 0 && app.me===st.turn;
}
function rematch(){
  const st = app.st, n = newGame((st.round||1)+1, st.seats);
  n.status='playing'; n.wins = {...st.wins}; n.seq = 0; app.reveal=false;
  if (app.mode==='online'){ app.st = {...st, round:n.round, seq:0}; publish(n); }
  else { n.seq = 1; app.st = n; render(); }
}
const oppOnline = () => Date.now() - app.oppSeen < 45000;

/* ---------- rendering ---------- */
function render(){
  const v = $('#view');
  if (!app.mode) { v.innerHTML = lobbyHTML(); bindLobby(); return; }
  v.innerHTML = gameHTML(); bindGame(); fitHeads();
}
function fitHeads(){
  document.querySelectorAll('.hd .t').forEach(el => {
    let fs = parseFloat(getComputedStyle(el).fontSize);
    while (fs > 9 && el.scrollWidth > el.clientWidth + 1){ fs -= 0.5; el.style.fontSize = fs + 'px'; }
  });
}
addEventListener('resize', () => { if (app.mode) fitHeads(); });
function lobbyHTML(){
  const online = true, saved = loadSaved();
  return `
  <section class="stack">
    <button class="btn primary" id="b-new" ${online?'':'disabled'}>Νέο online παιχνίδι<small>Παίρνεις τα Χ και ένα link για τον φίλο σου</small></button>
    <div class="stack" style="gap:6px">
      <label for="joincode" class="sub">Έχεις κωδικό από φίλο;</label>
      <div class="row"><input type="text" id="joincode" placeholder="π.χ. KRTMB" maxlength="5" autocomplete="off" autocapitalize="characters" ${online?'':'disabled'} style="flex:2 1 120px;text-transform:uppercase;letter-spacing:.15em">
      <button class="btn" id="b-join" ${online?'':'disabled'} style="flex:1 1 90px;text-align:center">Μπες</button></div>
    </div>
    ${saved && saved.code ? `<button class="btn" id="b-resume">Συνέχεια παιχνιδιού ${esc(saved.code)}<small>Το τελευταίο online παιχνίδι σου σε αυτή τη συσκευή</small></button>` : ''}
    ${app.msg?`<p class="err">${esc(app.msg)}</p>`:''}
    <button class="btn" id="b-local">Παιχνίδι σε μία συσκευή<small>Δίνετε το κινητό ο ένας στον άλλον</small></button>
  </section>
  <section class="stack" style="gap:8px">
    <h2>Κανόνες</h2>
    <ol class="rules">
      <li>Κάθε κουτί ζητά έναν παίκτη που ταιριάζει και στο κριτήριο της στήλης και στο κριτήριο της γραμμής.</li>
      <li>Παίζετε με τη σειρά. Σωστή απάντηση: παίρνεις το κουτί. Λάθος: χάνεις τη σειρά σου.</li>
      <li>Κάθε παίκτης χρησιμοποιείται μία φορά ανά παρτίδα.</li>
      <li>Online δεν χρειάζεται να είστε ταυτόχρονα μέσα: η παρτίδα μένει αποθηκευμένη και συνεχίζει όποτε ανοίξετε το link.</li>
      <li>Τρία στη σειρά κερδίζουν. Αν γεμίσει το ταμπλό ή πάνε και οι δύο πάσο, κερδίζει όποιος έχει τα περισσότερα κουτιά.</li>
    </ol>
    <p class="sub">${P.length} παίκτες της Ευρωλίγκας (2000–2026). Τίτλοι και βραβεία από τη Wikipedia· οι ομάδες και οι χρονιές κάθε παίκτη είναι από τη δική μας βάση και μπορεί να έχουν λάθη.</p>
  </section>`;
}
function bindLobby(){
  $('#b-local').onclick = startLocal;
  const nb = $('#b-new'); if (nb) nb.onclick = createOnline;
  const rb = $('#b-resume'); if (rb) rb.onclick = () => joinOnline(loadSaved().code);
  const jb = $('#b-join'), ji = $('#joincode');
  if (jb){ jb.onclick = () => joinOnline(ji.value); ji.onkeydown = e => { if (e.key==='Enter') joinOnline(ji.value); }; }
}
function seatLabel(m){
  if (app.mode==='local') return m==='X' ? 'Παίκτης 1' : 'Παίκτης 2';
  if (app.me===m) return 'Εσύ';
  if (app.st.status==='waiting') return 'Αναμονή…';
  return oppOnline() ? 'Αντίπαλος · online' : 'Αντίπαλος';
}
function gameHTML(){
  const st = app.st;
  if (!st) return `<p class="sub">${app.connected ? 'Αναζήτηση παιχνιδιού' : 'Σύνδεση'} ${esc(app.code||'')}…</p>${app.msg?`<p class="err">${esc(app.msg)}</p>`:''}<button class="btn" id="b-leave">Πίσω</button>`;
  let status;
  if (st.status==='waiting'){
    status = `<div class="codebox"><span class="sub">Στείλε το link στον φίλο σου ή πες του τον κωδικό</span><span class="code" style="font-size:2.4rem">${esc(app.code)}</span>
      <div class="row" style="width:100%">${navigator.share?'<button class="btn primary" id="b-share" style="text-align:center">Στείλε πρόσκληση</button>':''}<button class="btn" id="b-copy" style="text-align:center">Αντιγραφή link</button></div>
      <span class="sub">Μπορείς να κλείσεις τη σελίδα. Το παιχνίδι ξεκινά μόλις μπει ο φίλος σου.</span></div>`;
  } else if (st.status==='over'){
    const w = st.winner;
    status = `<p class="turnbar">${w==='draw' ? 'Ισοπαλία' : `Νίκη για το <span class="${w}">${w}</span>${app.mode==='online' ? (app.me===w?' · κέρδισες!':' · έχασες') : ''}`}</p>`;
  } else {
    const t = st.turn;
    const mine = app.mode==='local' || app.me===t;
    status = `<p class="turnbar">${mine ? `Σειρά ${app.mode==='local'?'του':'σου'} <span class="${t}">${t}</span>` : `Παίζει ο αντίπαλος <span class="${t}">${t}</span>`}</p>`;
  }
  const strip = `<div class="strip">
      <div class="side ${st.turn==='X'&&st.status==='playing'?'active':''}"><span class="mark X">X</span><span class="who">${seatLabel('X')}</span></div>
      <div class="score">${st.wins.X} – ${st.wins.O}<br><span style="font-size:.75rem">Παρτίδα ${st.round}${app.code?' · '+esc(app.code):''}</span></div>
      <div class="side r ${st.turn==='O'&&st.status==='playing'?'active':''}"><span class="mark O">O</span><span class="who">${seatLabel('O')}</span></div>
    </div>`;
  const hd = (id, cls) => { const c = C[CI[id]], l = c.s || c.label, mx = Math.max(...l.split(' ').map(w => w.length)), long = mx > 13 ? ' xxl' : mx > 9 ? ' xl' : mx > 7 ? ' long' : ''; return `<div class="hd ${cls}"><span class="k">${TYPE_LABEL[c.type]}</span><span class="t${long}" lang="el">${esc(l)}</span></div>`; };
  let board = `<div class="board"><div class="corner">${app.mode==='online' && app.me ? `Είσαι<br><span class="mark ${app.me}" style="font-size:1.6rem">${app.me}</span>` : ''}</div>`;
  st.grid.cols.forEach(id => board += hd(id,'col'));
  const act = canAct();
  for (let r=0;r<3;r++){
    board += hd(st.grid.rows[r],'row');
    for (let c=0;c<3;c++){
      const i = r*3+c, x = st.cells[i], win = st.line && st.line.includes(i);
      if (x) board += `<button class="cell ${x.m} ${win?'win':''}" disabled aria-label="${x.m}: ${esc(P[x.p].n)}"><span class="m">${x.m}</span><span class="pn">${esc(P[x.p].n)}</span></button>`;
      else if (st.status==='over' && app.reveal){
        const [ri,ci] = cellCrit(st,i), a = answers(ri,ci).filter(p=>!st.used.includes(p));
        board += `<div class="cell reveal"><span class="ans">${a.slice(0,4).map(p=>esc(P[p].n)).join('<br>')}${a.length>4?`<br>+${a.length-4}`:''}</span></div>`;
      }
      else board += `<button class="cell" data-cell="${i}" ${act?'':'disabled'} aria-label="Κουτί ${i+1}"><span class="plus">${act?'+':''}</span></button>`;
    }
  }
  board += `</div>`;
  let actions = '';
  if (st.status==='playing') actions = `<div class="row"><button class="btn" id="b-pass" ${act?'':'disabled'} style="text-align:center">Πάσο</button><button class="btn" id="b-leave" style="text-align:center">Έξοδος</button></div>`;
  else if (st.status==='over') actions = `<div class="row"><button class="btn primary" id="b-again" ${app.mode==='online'&&!app.connected?'disabled':''} style="text-align:center">Ρεβάνς</button><button class="btn" id="b-reveal" style="text-align:center">${app.reveal?'Κρύψε':'Δείξε'} απαντήσεις</button><button class="btn" id="b-leave" style="text-align:center">Έξοδος</button></div>`;
  else actions = `<div class="row"><button class="btn" id="b-leave" style="text-align:center">Ακύρωση</button></div>`;
  const log = st.log.length ? `<section class="log" aria-label="Εξέλιξη">${st.log.slice(0,8).map(e => {
      if (e.a==='pass') return `<div class="e"><span class="tag ${e.w}">${e.w}</span><span>πάσο</span></div>`;
      const [r,c] = cellCrit(st,e.c);
      return `<div class="e"><span class="tag ${e.w}">${e.w}</span><span>${esc(P[e.p].n)} <span class="sub">για ${esc(C[r].label)} × ${esc(C[c].label)}</span> <span class="${e.a==='ok'?'ok':'bad'}">${e.a==='ok'?'σωστό':'λάθος'}</span></span></div>`;
    }).join('')}</section>` : '';
  const offline = app.mode==='online' && !app.connected ? `<p class="err">Χωρίς σύνδεση. Προσπαθώ να ξανασυνδεθώ…</p>` : '';
  const wait = app.mode==='online' && st.status==='playing' && app.connected>0 && st.turn!==app.me && !oppOnline() ? `<div class="row" style="align-items:center"><p class="sub" style="flex:3 1 200px">Ο αντίπαλος δεν έχει τη σελίδα ανοιχτή. Η κίνησή του θα εμφανιστεί μόλις παίξει.</p><button class="btn" id="b-invite" style="text-align:center">Ξαναστείλε link</button></div>` : '';
  return `${strip}${offline}${status}${wait}${board}${app.msg?`<p class="err">${esc(app.msg)}</p>`:''}${actions}${log}`;
}
function bindGame(){
  document.querySelectorAll('.cell[data-cell]').forEach(b => b.onclick = () => openSheet(+b.dataset.cell));
  const on = (id,f) => { const el = $(id); if (el) el.onclick = f; };
  on('#b-leave', leave);
  on('#b-pass', () => { if (canAct()) commit(applyMove(app.st, null, null).s); });
  on('#b-again', rematch);
  on('#b-reveal', () => { app.reveal = !app.reveal; render(); });
  on('#b-copy', async () => {
    try { await navigator.clipboard.writeText(inviteLink(app.code)); $('#b-copy').textContent = 'Αντιγράφηκε'; }
    catch(e){ $('#b-copy').textContent = inviteLink(app.code); }
  });
  on('#b-share', async () => { try { await navigator.share({title:'Τρίλιζα Ευρωλίγκας', text:'Παίξε μαζί μου Τρίλιζα Ευρωλίγκας! Κωδικός ' + app.code, url:inviteLink(app.code)}); } catch(e){} });
  on('#b-invite', async () => { const l = inviteLink(app.code); try { if (navigator.share) await navigator.share({title:'Τρίλιζα Ευρωλίγκας', url:l}); else { await navigator.clipboard.writeText(l); $('#b-invite').textContent='Αντιγράφηκε'; } } catch(e){} });
}

/* ---------- answer sheet ---------- */
function openSheet(cell){
  if (!canAct()) return;
  const st = app.st, [r,c] = cellCrit(st, cell), sh = $('#sheet');
  sh.hidden = false;
  sh.innerHTML = `<div class="sheet-bg" id="sheet-bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="Απάντηση">
    <p class="q"><b>${esc(C[c].label)}</b> &nbsp;×&nbsp; <i>${esc(C[r].label)}</i></p>
    <input type="text" id="q" placeholder="Γράψε όνομα παίκτη (ελληνικά ή λατινικά)" autocomplete="off" autocorrect="off" spellcheck="false">
    <div class="res" id="res"><p class="sub">Γράψε τουλάχιστον 2 γράμματα.</p></div>
    <button class="btn" id="b-close" style="text-align:center">Άκυρο</button>
  </div></div>`;
  const q = $('#q'); q.focus();
  q.oninput = () => {
    const hits = search(q.value);
    $('#res').innerHTML = hits.length ? hits.map(i => {
      const used = st.used.includes(i);
      return `<button data-p="${i}" ${used?'disabled':''}><span>${esc(P[i].n)}${used?' <span class="sub">(χρησιμοποιήθηκε)</span>':''}</span><span class="nat">${esc(P[i].nat.join(' / '))}</span></button>`;
    }).join('') : (q.value.trim().length>=2 ? '<p class="sub">Κανένας παίκτης με αυτό το όνομα στη βάση.</p>' : '<p class="sub">Γράψε τουλάχιστον 2 γράμματα.</p>');
    document.querySelectorAll('#res button[data-p]').forEach(b => b.onclick = () => choose(cell, +b.dataset.p));
  };
  $('#b-close').onclick = closeSheet;
  $('#sheet-bg').onclick = e => { if (e.target.id==='sheet-bg') closeSheet(); };
}
function closeSheet(){ const sh = $('#sheet'); sh.hidden = true; sh.innerHTML = ''; }
function choose(cell, p){
  if (!canAct()) { closeSheet(); return; }
  const {s, ok} = applyMove(app.st, cell, p);
  const sheet = document.querySelector('.sheet');
  sheet.innerHTML = `<p class="toast ${ok?'ok':'bad'}">${ok ? 'Σωστό! ' + esc(P[p].n) : 'Λάθος — ο ' + esc(P[p].n) + ' δεν ταιριάζει. Χάνεις τη σειρά σου.'}</p>`;
  setTimeout(() => { closeSheet(); commit(s); }, ok ? 700 : 1500);
}
document.addEventListener('keydown', e => { if (e.key==='Escape' && !$('#sheet').hidden) closeSheet(); });

(function boot(){
  const g = new URLSearchParams(location.search).get('g');
  if (g && cleanCode(g).length===CODE_LEN){ joinOnline(g); return; }
  render();
})();
setInterval(() => { if (app.mode==='online') render(); }, 20000);
</script>
</body>
</html>
